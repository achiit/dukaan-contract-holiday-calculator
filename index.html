<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Holiday Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <main class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <header class="bg-slate-800 p-6 text-center">
            <h1 class="text-2xl font-bold text-white">Holiday Calculator</h1>
            <p class="text-slate-300 text-sm mt-2">Based on 1 hr holiday for every 8 hrs 17 mins worked.</p>
        </header>

        <div class="p-6 space-y-6">
            <section class="space-y-4" aria-label="Calculator inputs">
                <div>
                    <label for="total-hours" class="block text-sm font-semibold text-slate-700 mb-1">Total Hours Worked</label>
                    <input type="number" id="total-hours" placeholder="e.g. 1486.48" step="any" min="0" inputmode="decimal"
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-lg text-slate-900 bg-slate-50">
                </div>
                <div>
                    <label for="used-hours" class="block text-sm font-semibold text-slate-700 mb-1">Used Holiday (in hours)</label>
                    <input type="number" id="used-hours" placeholder="e.g. 160" step="any" inputmode="decimal"
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-lg text-slate-900 bg-slate-50">
                    <p class="text-xs text-slate-500 mt-1.5 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        Note: 1 standard working day = 8 hours
                    </p>
                </div>
            </section>

            <hr class="border-slate-200">

            <section class="space-y-4" aria-live="polite" aria-label="Holiday calculation results">
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <h2 class="text-sm font-semibold text-blue-800 uppercase tracking-wide mb-3">Total Accrued Holiday</h2>
                    <div class="flex justify-between items-end gap-3">
                        <div><span id="accrued-hours" class="text-2xl font-bold text-blue-900">0.00</span><span class="text-blue-700 text-sm font-medium ml-1">hrs</span></div>
                        <div class="text-blue-300 font-light text-2xl">/</div>
                        <div><span id="accrued-days" class="text-2xl font-bold text-blue-900">0.00</span><span class="text-blue-700 text-sm font-medium ml-1">days</span></div>
                    </div>
                </div>

                <div id="remaining-container" class="bg-emerald-50 p-4 rounded-xl border border-emerald-100 shadow-inner">
                    <h2 id="remaining-title" class="text-sm font-semibold text-emerald-800 uppercase tracking-wide mb-3">Remaining Balance</h2>
                    <div class="flex justify-between items-end gap-3">
                        <div><span id="remaining-hours" class="text-3xl font-extrabold text-emerald-900">0.00</span><span id="remaining-hours-unit" class="text-emerald-700 text-sm font-medium ml-1">hrs</span></div>
                        <div id="remaining-slash" class="text-emerald-300 font-light text-3xl">/</div>
                        <div><span id="remaining-days" class="text-3xl font-extrabold text-emerald-900">0.00</span><span id="remaining-days-unit" class="text-emerald-700 text-sm font-medium ml-1">days</span></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        // Contract rule: 1 holiday hour for every 8 hours and 17 minutes worked.
        const ACCRUAL_RATE = 8 + (17 / 60);
        const HOURS_PER_DAY = 8;

        const totalHoursInput = document.getElementById('total-hours');
        const usedHoursInput = document.getElementById('used-hours');

        const accruedHoursDisplay = document.getElementById('accrued-hours');
        const accruedDaysDisplay = document.getElementById('accrued-days');
        const remainingHoursDisplay = document.getElementById('remaining-hours');
        const remainingDaysDisplay = document.getElementById('remaining-days');

        const remainingContainer = document.getElementById('remaining-container');
        const remainingTitle = document.getElementById('remaining-title');
        const remainingSlash = document.getElementById('remaining-slash');
        const remainingUnits = [
            document.getElementById('remaining-hours-unit'),
            document.getElementById('remaining-days-unit')
        ];

        function setBalanceStyle(isNegative) {
            remainingContainer.classList.toggle('bg-red-50', isNegative);
            remainingContainer.classList.toggle('border-red-100', isNegative);
            remainingContainer.classList.toggle('bg-emerald-50', !isNegative);
            remainingContainer.classList.toggle('border-emerald-100', !isNegative);

            [remainingHoursDisplay, remainingDaysDisplay].forEach(el => {
                el.classList.toggle('text-red-900', isNegative);
                el.classList.toggle('text-emerald-900', !isNegative);
            });

            [remainingTitle].forEach(el => {
                el.classList.toggle('text-red-800', isNegative);
                el.classList.toggle('text-emerald-800', !isNegative);
            });

            [...remainingUnits].forEach(el => {
                el.classList.toggle('text-red-700', isNegative);
                el.classList.toggle('text-emerald-700', !isNegative);
            });

            remainingSlash.classList.toggle('text-red-300', isNegative);
            remainingSlash.classList.toggle('text-emerald-300', !isNegative);
        }

        function calculateHoliday() {
            const totalHoursWorked = Math.max(0, Number.parseFloat(totalHoursInput.value) || 0);
            const usedHolidayHours = Number.parseFloat(usedHoursInput.value) || 0;

            const accruedHours = totalHoursWorked / ACCRUAL_RATE;
            const accruedDays = accruedHours / HOURS_PER_DAY;
            const remainingHours = accruedHours - usedHolidayHours;
            const remainingDays = remainingHours / HOURS_PER_DAY;

            accruedHoursDisplay.textContent = accruedHours.toFixed(2);
            accruedDaysDisplay.textContent = accruedDays.toFixed(2);
            remainingHoursDisplay.textContent = remainingHours.toFixed(2);
            remainingDaysDisplay.textContent = remainingDays.toFixed(2);

            setBalanceStyle(remainingHours < 0);
        }

        totalHoursInput.addEventListener('input', calculateHoliday);
        usedHoursInput.addEventListener('input', calculateHoliday);
        calculateHoliday();
    </script>
</body>
</html>
